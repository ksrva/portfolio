<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KS">
  <!--
    Set as real type rather than hand-drawn paths.

    The cursive version before this was a monoline I drew by hand, and it fell
    apart at 16px: the strokes blurred into each other and the counters closed
    up, which is the size a favicon is actually used at. A serif face is drawn
    and hinted properly, so the letterforms survive the shrink in a way my
    approximation of them did not.

    font-family names a stack ending in the generic `serif`, which always
    resolves, so this renders as a serif everywhere even if Georgia is absent.
    The exact letterforms can differ between machines; for a two-letter
    monogram that is an acceptable trade for type that is actually well drawn.

    Regular weight rather than bold. Bold was the safer choice for the 16px
    tab icon — thin serif strokes and the hairlines of the serifs themselves
    are the first thing to disappear when a mark is shrunk — so this trades a
    little small-size robustness for the lighter, higher-contrast look.

    Still no plate behind it. An SVG favicon carries its own stylesheet, so the
    ink follows the viewer's theme: near-black on a light tab, paper cream on a
    dark one, with the near-black as the fallback where that is not honoured.

    Baseline at 46.5 rather than centred by dominant-baseline, which browsers
    disagree about: at this size the cap height lands the pair on the middle.
  -->
  <style>
    .ink { fill: #17120e; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f4ecdc; }
    }
  </style>

  <text
    class="ink"
    x="32"
    y="46.5"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="42"
    font-weight="400"
    letter-spacing="-0.5"
  >KS</text>
</svg>
